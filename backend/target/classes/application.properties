spring.application.name=boardingmate-backend

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/boardingmate
spring.datasource.username=postgres
spring.datasource.password=postgres

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Secret (Example key, should be moved to env var in production)
# length must be >= 256 bits for HS256
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000
